<meta charset="utf-8">
<title>Planner — construction scheduling</title>
<style>
:root{
  --bg:#f3f4f6;--panel:#fff;--ink:#16181d;--muted:#5f6670;--line:#dfe3e8;--accent:#1f5eff;--accent-ink:#fff;
  --crit:#d92d20;--bar:#5b6b88;--ms:#16181d;--ok:#12805c;--warn:#b54708;--sel:#dce7ff;--sel2:#eef3ff;--grid:#eceef2;--today:#7c3aed;
  --summary:#2b2f3a;--baseline:#9aa4b5;--progress:#0b8a3e;--hist:#6d8fd6;--over:#e0524a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--rh:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--panel:#171a21;--ink:#e8eaf0;--muted:#98a0ad;--line:#2a2f3a;--accent:#5b8cff;--crit:#f26a5e;--bar:#8b9bb8;
  --ms:#e8eaf0;--ok:#3ccf91;--warn:#f5a524;--sel:#25355c;--sel2:#1c2537;--grid:#1c2029;--today:#a78bfa;--summary:#c9d1e0;--baseline:#5f6a7d;}}
:root[data-theme="dark"]{--bg:#0f1115;--panel:#171a21;--ink:#e8eaf0;--muted:#98a0ad;--line:#2a2f3a;--accent:#5b8cff;--crit:#f26a5e;--bar:#8b9bb8;--ms:#e8eaf0;--ok:#3ccf91;--warn:#f5a524;--sel:#25355c;--sel2:#1c2537;--grid:#1c2029;--today:#a78bfa;--summary:#c9d1e0;--baseline:#5f6a7d;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.on{background:var(--sel);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
.app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh}
.ribbon{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.rgroup{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 8px 16px;border-right:1px solid var(--line);position:relative;max-width:520px}
.rgroup:last-child{border-right:none}
.rlabel{position:absolute;bottom:0;left:8px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tog{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:0 4px}
.menu{position:relative}
.menu-items{display:none;position:absolute;top:100%;left:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:180px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.menu:hover .menu-items{display:block}
.menu-items a{display:block;padding:6px 10px;cursor:pointer}
.menu-items a:hover{background:var(--sel2)}
.summary{display:flex;gap:14px;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--panel)}
.summary b{color:var(--ink);font-weight:600}
.work{display:grid;grid-template-rows:1fr auto;min-height:0}
#sheet{overflow:auto;position:relative;outline:none;background:var(--panel)}
#inner{position:relative}
.hdr{position:sticky;top:0;z-index:5;display:flex;height:44px;background:var(--panel);border-bottom:1px solid var(--line)}
.hdr-grid{position:sticky;left:0;z-index:6;display:flex;background:var(--panel);border-right:1px solid var(--line);height:44px}
.hdr-grid .c{display:flex;align-items:flex-end;padding:0 6px 4px;font-size:11px;color:var(--muted);border-right:1px solid var(--grid);overflow:hidden;white-space:nowrap;cursor:pointer;user-select:none}
.hdr-grid .c.sorted{color:var(--accent)}
.hdr-time{position:relative}
.rows{position:relative}
.row{display:flex;height:var(--rh)}
.cells{position:sticky;left:0;z-index:2;display:flex;background:var(--panel);border-bottom:1px solid var(--grid);border-right:1px solid var(--line);height:var(--rh)}
.row.sel .cells{background:var(--sel)}
.row.wbs .cells{background:var(--grid);font-weight:600}
.row.wbs.sel .cells{background:var(--sel)}
.row.group .cells{background:var(--sel2);font-weight:600}
.c{display:flex;align-items:center;padding:0 6px;border-right:1px solid var(--grid);overflow:hidden;white-space:nowrap;font-size:12.5px}
.c.num{justify-content:flex-end;font-family:var(--mono);font-size:11.5px}
.c.active{outline:2px solid var(--accent);outline-offset:-2px}
.c input,.c select{width:100%;height:22px;padding:0 4px;border-radius:3px;font-size:12.5px}
.c .tw{display:inline-block;width:14px;cursor:pointer;color:var(--muted);font-size:10px;text-align:center;flex:none}
.c.crit{color:var(--crit)}
.c .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;flex:none}
svg.chart{position:absolute;top:0;pointer-events:none}
svg.chart .hit{pointer-events:all}
svg text{font-family:inherit;font-size:11px}
.bar{cursor:grab}
.bar.drag{cursor:grabbing}
.handle{cursor:ew-resize}
.linkdot{cursor:crosshair}
.link.sel{stroke-width:2.5}
.panel{border-top:1px solid var(--line);background:var(--panel);max-height:38vh;overflow:auto;padding:10px 14px}
.panel h3{margin:0 0 6px;font-size:13px}
.panel .bar-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.cmdbar{display:flex;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);background:var(--panel)}
.cmdbar input{flex:1;font-family:var(--mono);font-size:12px}
.hint{font-size:11.5px;color:var(--muted)}
.crit{color:var(--crit)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 8px;border-radius:6px;font-size:12px;display:none;z-index:50;max-width:340px}
.ctx{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:220px;padding:4px}
.ctx div{padding:6px 10px;cursor:pointer;border-radius:4px;font-size:12.5px}
.ctx div:hover{background:var(--sel2)}
.ctx hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.ctx div.sub{color:var(--muted);font-size:11px;cursor:default}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:flex;align-items:center;justify-content:center}
.modal{background:var(--panel);border-radius:12px;padding:16px 18px;min-width:420px;max-width:min(860px,95vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 10px;font-size:15px}
.modal .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 10px}
.modal label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.modal label.row{flex-direction:row;align-items:center;gap:6px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal table{border-collapse:collapse;width:100%;font-size:12.5px}
.modal th,.modal td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.modal td input,.modal td select{width:100%}
.modal .days{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:80;font-size:12.5px;max-width:70vw}
.check{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.check .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--ok)}
.check.fail .dot{background:var(--crit)}
.check.na .dot{background:var(--muted)}
.check .d{color:var(--muted);font-size:12px}
.check .items{font-family:var(--mono);font-size:11px;word-break:break-word}
.check .items a{cursor:pointer;color:var(--accent)}
.kv{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}
.kv b{font-size:14px}
.print-title{display:none}
@media print{
  body{overflow:visible;background:#fff;color:#000}
  .ribbon,.cmdbar,.panel,.tip,.ctx,.toast,.modal-back{display:none!important}
  .app{display:block;height:auto}
  #sheet{overflow:visible;height:auto}
  .hdr,.cells,.hdr-grid{position:static}
  .print-title{display:block;padding:8px 12px;border-bottom:2px solid #000;font-size:12px}
  svg.chart{position:absolute}
}

.bandrow{position:sticky;bottom:0;z-index:3;display:flex;background:var(--panel);border-top:1px solid var(--line);height:150px}
.bandrow .cells{position:sticky;left:0;z-index:4;flex-direction:column;align-items:flex-start;padding:6px 8px;font-size:12px;height:150px;border-bottom:none}
.bandrow svg{display:block}
.colgrip{position:absolute;right:0;top:0;width:6px;height:100%;cursor:col-resize}
.hdr-grid .c{position:relative}

</style>

function hslToHex(hsl) { const m = hsl.match(/hsl\((\d+),(\d+)%,(\d+)%\)/); if (!m) return '#888888'; let [h, s, l] = [+m[1], +m[2] / 100, +m[3] / 100]; const k = n => (n + h / 30) % 12; const a = s * Math.min(l, 1 - l); const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return '#' + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join(''); }

// ---------- panels ----------
function setPanel(name) { S.panel = S.panel === name ? null : name; $('#panel').hidden = !(S.panel === 'health' || S.panel === 'notes'); render(); refreshPanel(); }
async function refreshPanel() {
  if (!S.pid) return;
  try {
    if (S.panel === 'histogram') { S.hist = await api('/api/projects/' + encodeURIComponent(S.pid) + '/histogram'); renderBand(); }
    if (S.panel === 'cost') { S.costs = await api('/api/projects/' + encodeURIComponent(S.pid) + '/costs'); renderBand(); }
  } catch (e) { toast(e.message); }
}
function renderBand() {
  const g = $('#bandSvg'); const label = $('#bandLabel'); if (!g || !label) return;
  const x = S.x, W = S.ganttW, H = 150, px = S.view.pxDay; let s = '';
  if (S.panel === 'histogram' && S.hist) {
    const res = S.hist.resources; if (!S.histRes || !res.find(r => r.resource_id === S.histRes)) S.histRes = res.length ? res.sort((a, b) => b.overallocated_days - a.overallocated_days)[0].resource_id : '';
    const r = res.find(q => q.resource_id === S.histRes);
    label.innerHTML = `<b>Resource histogram</b><select id="histSel" style="margin:4px 0">${res.map(q => `<option value="${esc(q.resource_id)}" ${q.resource_id === S.histRes ? 'selected' : ''}>${esc(q.name)}${q.overallocated_days ? ' ⚠' : ''}</option>`).join('')}</select>` + (r ? `<span class="hint">limit ${r.limit ?? '∞'}/day · peak ${r.peak} · ${r.overallocated_days} day(s) over · ${r.total_units} h total</span>` : '<span class="hint">no resources assigned</span>');
    $('#histSel').onchange = e => { S.histRes = e.target.value; renderBand(); };
    if (r) {
      const weekly = px < 5; const buckets = {};
      r.days.forEach(d => { const dt = new Date(d.date); const k = weekly ? ymd(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - ((dt.getDay() + 6) % 7))) : d.date; buckets[k] = (buckets[k] || 0) + d.units; });
      const div = weekly ? 5 : 1; const maxv = Math.max(r.limit || 0, ...Object.values(buckets).map(v => v / div)) || 1; const sc = (H - 30) / maxv;
      Object.entries(buckets).forEach(([k, v]) => { const avg = v / div; const bx = x(k), bw = Math.max(1, px * (weekly ? 7 : 1) - 1); const h = avg * sc; const over = r.limit && avg > r.limit + 1e-6; s += `<rect x="${bx}" y="${H - 10 - h}" width="${bw}" height="${h}" fill="var(--hist)"/>`; if (over) s += `<rect x="${bx}" y="${H - 10 - h}" width="${bw}" height="${(avg - r.limit) * sc}" fill="var(--over)"/>`; });
      if (r.limit) s += `<line x1="0" y1="${H - 10 - r.limit * sc}" x2="${W}" y2="${H - 10 - r.limit * sc}" stroke="var(--crit)" stroke-dasharray="3 3"/><text x="4" y="${H - 14 - r.limit * sc}" fill="var(--crit)">limit ${r.limit}</text>`;
      s += `<text x="4" y="14" fill="var(--muted)">${esc(r.name)} · ${weekly ? 'average per day, by week' : 'people per day'}</text>`;
    }
  } else if (S.panel === 'cost' && S.costs) {
    const c = S.costs, mt = c.metrics; const max = Math.max(1, ...c.weeks.map(w => Math.max(w.planned, w.baseline, w.earned, w.actual))); const sc = (H - 30) / max;
    label.innerHTML = `<b>Cost / earned value</b><div class="hint">budget £${mt.budget.toLocaleString()} · BCWS £${mt.bcws.toLocaleString()} · BCWP £${mt.bcwp.toLocaleString()}${mt.acwp ? ' · ACWP £' + mt.acwp.toLocaleString() : ''}<br>SPI ${mt.spi ?? '–'} · CPI ${mt.cpi ?? '–'} · SV £${mt.sv.toLocaleString()}${c.has_baseline ? '' : ' · set a baseline for BCWS'}</div>`;
    const line = (key, col, dash) => { if (!c.weeks.some(w => w[key])) return ''; return `<polyline points="${c.weeks.map(w => `${x(w.week)},${H - 10 - w[key] * sc}`).join(' ')}" fill="none" stroke="${col}" stroke-width="1.8" ${dash ? 'stroke-dasharray="4 3"' : ''}/>`; };
    s += line('planned', 'var(--hist)') + line('baseline', 'var(--baseline)', true) + line('earned', 'var(--progress)') + line('actual', 'var(--crit)');
    s += `<text x="4" y="14" fill="var(--muted)">cumulative £ · planned (blue), baseline (dashed), earned (green), actual (red)</text>`;
    for (const f of [0.25, 0.5, 0.75, 1]) s += `<line x1="0" y1="${H - 10 - max * f * sc}" x2="${W}" y2="${H - 10 - max * f * sc}" stroke="var(--grid)"/><text x="${W - 60}" y="${H - 12 - max * f * sc}" fill="var(--muted)">£${Math.round(max * f / 1000)}k</text>`;
  }

function zoom(f) { S.view.pxDay = Math.max(1, Math.min(40, S.view.pxDay * f)); render(); }
function onKey(e) {
  if (S.editing || !S.project) return;
  const k = e.key;
  if (k === 'ArrowDown') { e.preventDefault(); moveActive(1, 0); } else if (k === 'ArrowUp') { e.preventDefault(); moveActive(-1, 0); }
  else if (k === 'ArrowLeft') { e.preventDefault(); moveActive(0, -1); } else if (k === 'ArrowRight') { e.preventDefault(); moveActive(0, 1); }
  else if (k === 'Enter' || k === 'F2') { e.preventDefault(); if (S.active) startEdit(S.active, S.activeCol); }
  else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSelected(); }
  else if (k === 'Insert') { e.preventDefault(); insertActivity(); }
  else if (k === 'Tab') { e.preventDefault(); indent(e.shiftKey ? -1 : 1); }
  else if (k === ' ' && wbsById(S.active)) { e.preventDefault(); toggleCollapse(S.active); }
  else if (e.altKey && k === 'ArrowUp') { e.preventDefault(); moveRow(-1); } else if (e.altKey && k === 'ArrowDown') { e.preventDefault(); moveRow(1); }
  else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'l') { e.preventDefault(); linkSelected(); } else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'u') { e.preventDefault(); unlinkSelected(); }
  else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'c') { e.preventDefault(); copySelected(); } else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'v') { e.preventDefault(); pasteClip(); }
  else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'a') { e.preventDefault(); S.sel = new Set(S.rowsCache.map(rowKey)); paintSelection(); }
  else if (k === 'Escape') { S.sel = new Set(); S.selLink = null; paintSelection(); }
  else if (k === '+' || k === '=') zoom(1.25); else if (k === '-') zoom(0.8);
  else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && S.active && byId(S.active) && ALL_COLS[S.activeCol].set) { startEdit(S.active, S.activeCol); const inp = S.editing && S.editing.inp; if (inp && inp.type !== 'date' && inp.tagName === 'INPUT') { inp.value = k; e.preventDefault(); } }
}

// ---------- init ----------
(async () => {
  try { const c = JSON.parse(localStorage.getItem('cols') || 'null'); if (Array.isArray(c) && c.length) S.cols = c.filter(k => ALL_COLS[k]); const w = JSON.parse(localStorage.getItem('colw') || 'null'); if (w) Object.entries(w).forEach(([k, v]) => { if (ALL_COLS[k] && v > 20) ALL_COLS[k].w = v; }); } catch { }
  try { const all = JSON.parse(localStorage.getItem('planner:projects') || '{}'); if (!Object.keys(all).length) window.__local.store(window.__DEMO); } catch (e) { }
  wireToolbar();
  await loadList();
  let last = null; try { last = localStorage.getItem('pid'); } catch { }
  if (last) openProject(last).catch(() => { });
})();

</script>

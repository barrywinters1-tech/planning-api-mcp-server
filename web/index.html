<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <div class="ribbon" id="ribbon">
    <div class="rgroup">
      <select id="projSel" title="Open project"><option value="">— open —</option></select>
      <button id="btnNew" title="New blank project">New</button>
      <button id="btnGenerate" title="Generate a programme from a brief">Generate…</button>
      <label class="btn" title="Import XER, P6 XML, MS Project XML, .pp, .mpp">Import<input type="file" id="fileIn" accept=".xer,.xml,.pmxml,.json,.pp,.mpp,.mpx" hidden></label>
      <div class="menu"><button>Export ▾</button><div class="menu-items"><a data-x="xer">Primavera P6 (XER)</a><a data-x="xml">Asta / MS Project (XML)</a><a data-x="json">JSON</a></div></div>
      <button id="btnPrint" title="Print (Ctrl+P)">Print</button>
      <span class="rlabel">File</span>
    </div>
    <div class="rgroup">
      <button id="btnUndo" title="Undo (Ctrl+Z)">↶</button><button id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
      <button id="btnInsert" title="Insert activity below (Insert)">+ Activity</button>
      <button id="btnSummary" title="Insert summary (WBS) below">+ Summary</button>
      <button id="btnDelete" title="Delete selected (Del)">Delete</button>
      <button id="btnOutdent" title="Outdent (Shift+Tab)">⇤</button><button id="btnIndent" title="Indent (Tab)">⇥</button>
      <button id="btnUp" title="Move up (Alt+↑)">↑</button><button id="btnDown" title="Move down (Alt+↓)">↓</button>
      <button id="btnLink" title="Link selected in order, finish-to-start (Ctrl+L)">Link</button>
      <button id="btnUnlink" title="Remove links between selected (Ctrl+U)">Unlink</button>
      <span class="rlabel">Edit</span>
    </div>
    <div class="rgroup">
      <select id="vMode" title="Chart type"><option value="gantt">Gantt</option><option value="tl">Time–location</option></select>
      <select id="vTl" hidden><option value="WBS">Location: WBS</option></select>
      <button id="btnZoomOut" title="Zoom out">−</button><button id="btnZoomIn" title="Zoom in">+</button><button id="btnFit" title="Fit to window">Fit</button>
      <label class="tog"><input type="checkbox" id="vLinks" checked> links</label>
      <label class="tog"><input type="checkbox" id="vFloat" checked> float</label>
      <label class="tog"><input type="checkbox" id="vBaseline"> baseline</label>
      <label class="tog"><input type="checkbox" id="vProgress"> progress line</label>
      <label class="tog"><input type="checkbox" id="vCritical"> critical only</label>
      <select id="vColour" title="Colour bars by"><option value="critical">Colour: critical</option><option value="none">Colour: plain</option></select>
      <select id="vGroup" title="Group rows by"><option value="">Group: WBS</option></select>
      <select id="vSort" title="Sort within groups"><option value="">Sort: sequence</option><option value="start">Sort: start</option><option value="finish">Sort: finish</option><option value="float">Sort: float</option><option value="id">Sort: ID</option><option value="name">Sort: name</option></select>
      <input id="vFilter" placeholder="filter…" title="Filter by text, or Trade=Bricklayers">
      <button id="btnColumns" title="Choose columns">Columns…</button>
      <span class="rlabel">View</span>
    </div>
    <div class="rgroup">
      <label class="tog">Data date <input type="date" id="dataDate"></label>
      <button id="btnProgress" title="Enter progress for selected activities">Progress…</button>
      <button id="btnConstraint" title="Set a constraint on the selected activity">Constraint…</button>
      <button id="btnMilestone" title="Toggle milestone">Milestone</button>
      <span class="rlabel">Progress</span>
    </div>
    <div class="rgroup">
      <button id="btnBaseline" title="Store current dates as the baseline">Set baseline</button>
      <button id="btnBaselineClear">Clear</button>
      <button id="btnLevel" title="Delay activities so no resource exceeds its limit">Level</button>
      <button id="btnUnlevel">Unlevel</button>
      <button id="btnCalendars">Calendars…</button>
      <button id="btnResources">Resources…</button>
      <button id="btnCodes">Codes…</button>
      <span class="rlabel">Plan</span>
    </div>
    <div class="rgroup">
      <button data-panel="histogram">Histogram</button>
      <button data-panel="cost">Cost / EV</button>
      <button data-panel="health">Health</button>
      <button data-panel="notes">Notes</button>
      <button id="btnRepair" title="Run the DCMA auto-repairer">Auto-repair</button>
      <span class="rlabel">Analyse</span>
    </div>
  </div>
  <div class="summary" id="summary"><span>No project open. Open one, press New, Generate… or Import.</span></div>
  <div class="work">
    <div id="sheet" tabindex="0">
      <div id="inner">
        <div class="hdr" id="hdr"></div>
        <div class="rows" id="rows"></div>
      </div>
    </div>
    <div class="panel" id="panel" hidden></div>
  </div>
  <form class="cmdbar" id="cmdForm"><span class="hint">Command</span><input id="cmdIn" placeholder="add 2 weeks to Piling · link A1010 -> A1020 SS+2d · finish by 1 Nov 2026 · progress A1010 50% as of 20 Apr 2026 · fix · help" autocomplete="off"><button class="primary">Run</button><span id="cmdOut" class="hint"></span></form>
</div>
<div class="print-title" id="printTitle"></div>
<div class="tip" id="tip"></div>
<div class="ctx" id="ctx" hidden></div>
<div class="modal-back" id="modalBack" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
